<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      /*
       * Runtime base auto-detection: one static build runs under any nginx subpath. We find the
       * mount prefix by probing upward for the base root, which answers HTTP 204. On a match we set
       * <base href> and inject the hashed entry baked in at build (__ENTRY_JS__ / __ENTRY_CSS__).
       */
      (function () {
        var ENTRY = '__ENTRY_JS__';
        var ENTRY_CSS = '__ENTRY_CSS__'; // comma-separated hrefs

        var path = location.pathname;
        var dir = path.charAt(path.length - 1) === '/'
          ? path
          : path.slice(0, path.lastIndexOf('/') + 1);

        // Candidate bases, most-specific first: e.g. ['/tv/news/', '/tv/', '/'].
        var candidates = [];
        if (path !== dir) candidates.push(path + '/'); // app mounted exactly at a no-slash path
        var cur = dir;
        while (true) {
          candidates.push(cur);
          if (cur === '/' || cur === '') break;
          cur = cur.slice(0, cur.lastIndexOf('/', cur.length - 2) + 1);
        }

        function start(base) {
          window.__APP_BASE__ = base;
          var baseEl = document.createElement('base');
          baseEl.href = base;
          document.head.insertBefore(baseEl, document.head.firstChild);

          ENTRY_CSS.split(',').forEach(function (href) {
            if (!href) return;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = base + href;
            document.head.appendChild(link);
          });
          var s = document.createElement('script');
          s.type = 'module';
          s.src = base + ENTRY;
          document.body.appendChild(s);
        }

        function devFallback() {
          // No 204 marker found (vite dev server). Served at root; load the TS entry directly.
          window.__APP_BASE__ = '/';
          var s = document.createElement('script');
          s.type = 'module';
          s.src = '/src/main.ts';
          document.body.appendChild(s);
        }

        var i = 0;
        (function tryNext() {
          if (i >= candidates.length) return devFallback();
          var base = candidates[i++];
          // The base root answers 204; channel paths answer 200 (index.html); everything else 404s.
          fetch(base, { method: 'HEAD', cache: 'no-store' })
            .then(function (r) { if (r.status === 204) start(base); else tryNext(); })
            .catch(function () { tryNext(); });
        })();
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
