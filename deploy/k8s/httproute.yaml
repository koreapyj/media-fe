apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media-fe
  labels:
    app.kubernetes.io/name: media-fe
spec:
  # Attach to your existing (shared) Gateway. TLS terminates on the Gateway listener, not here.
  parentRefs:
    - name: GATEWAY_NAME
      namespace: GATEWAY_NAMESPACE
  hostnames:
    - tv.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: media-fe
          port: 80
