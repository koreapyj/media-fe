# Sample nginx config for serving the TV player as static files (no daemons).
#
# The app auto-detects its mount prefix at runtime (see index.html), so this works whether you
# serve it at the web root (/) or under any subpath. Two variants are shown — pick one.
#
# Build first:  npm run build   (outputs ./dist)

types {
    application/wasm wasm;
}

# --- Variant A: served at the web root -------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /var/www/media-fe/dist;   # <-- point at your built dist/
    index index.html;

    # Long-cache fingerprinted assets (filenames change on every build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # libass worker/wasm — content-addressed by build; safe to cache for a while.
    location /libass/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Subtitle fonts (e.g. the ~8 MB ARIB face) — large and stable; cache aggressively.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The bootstrap probes these on every load; never cache stale copies.
    location = /index.html   { add_header Cache-Control "no-cache"; }
    location = /manifest.json { add_header Cache-Control "no-cache"; }

    # SPA fallback: any unknown path (e.g. /cnn/) renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

