# nginx server block for the container image (the base image provides http/events + mime.types).
# Routing matches the app's two URL shapes: "/" is a 204 base-detection marker (no home page),
# and "/<one-segment>/" is a channel document. Anything else is a real file or a 404.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location ^~ /assets/ { expires 1y;  add_header Cache-Control "public, immutable"; }
    location ^~ /libass/ { expires 30d; add_header Cache-Control "public"; }
    location ^~ /fonts/  { expires 1y;  add_header Cache-Control "public, immutable"; }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Base-detection marker.
    location = / {
        add_header Cache-Control "no-cache";
        return 204;
    }

    # Channel documents: "/<id>/" (the app's canonical trailing-slash form) -> the app shell.
    location ~ ^/[^/]+/$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Everything else (notably /config.json) is served from the ConfigMap mount; never cached so
    # updates show on reload. App assets are handled by the prioritized locations above.
    location / {
        root /etc/media-fe;
        add_header Cache-Control "no-cache";
    }
}
